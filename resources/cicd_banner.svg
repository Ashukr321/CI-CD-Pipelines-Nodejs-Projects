<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a3a"/>
      <stop offset="1" stop-color="#1a0f33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.15" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.9" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .flow { stroke-dasharray: 10 12; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -44; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      .d1 { animation-delay: 0s; } .d2 { animation-delay: .4s; } .d3 { animation-delay: .8s; }
      .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.6s; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glowL)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glowR)"/>
  <rect x="1" y="1" width="1278" height="418" rx="23" fill="none" stroke="url(#accent)" stroke-opacity="0.5" stroke-width="2"/>

  <!-- badge -->
  <g transform="translate(80 58)">
    <rect width="238" height="32" rx="16" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.5"/>
    <circle cx="20" cy="16" r="5" fill="#34d399" class="pulse"/>
    <text x="34" y="21" font-size="14" fill="#a5f3fc" letter-spacing="1.5" font-weight="600">DEVOPS · AUTOMATION</text>
  </g>

  <!-- title -->
  <text x="80" y="158" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1">CI/CD Pipelines</text>
  <text x="80" y="222" font-size="46" font-weight="700" fill="url(#accent)">for Node.js Projects</text>
  <text x="80" y="262" font-size="19" fill="#94a3b8">GitHub Actions · Docker · Nginx · Custom Domains · Automated Deploys</text>

  <!-- pipeline -->
  <g transform="translate(80 312)">
    <line x1="40" y1="30" x2="1080" y2="30" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="30" x2="1080" y2="30" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" class="flow"/>

    <g font-size="15" font-weight="600" text-anchor="middle">
      <g transform="translate(40 30)">
        <circle r="26" fill="#22d3ee" filter="url(#blur)" class="pulse d1"/>
        <circle r="22" fill="#0b1020" stroke="#22d3ee" stroke-width="3"/>
        <text y="5" fill="#22d3ee" font-size="16">&lt;/&gt;</text>
        <text y="58" fill="#e2e8f0">Code</text>
      </g>
      <g transform="translate(300 30)">
        <circle r="26" fill="#60a5fa" filter="url(#blur)" class="pulse d2"/>
        <circle r="22" fill="#0b1020" stroke="#60a5fa" stroke-width="3"/>
        <path d="M-9 -2 L-2 5 L10 -8" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 2)"/>
        <text y="58" fill="#e2e8f0">Build &amp; Test</text>
      </g>
      <g transform="translate(560 30)">
        <circle r="26" fill="#818cf8" filter="url(#blur)" class="pulse d3"/>
        <circle r="22" fill="#0b1020" stroke="#818cf8" stroke-width="3"/>
        <g fill="#818cf8"><rect x="-10" y="-6" width="6" height="5"/><rect x="-3" y="-6" width="6" height="5"/><rect x="4" y="-6" width="6" height="5"/><rect x="-3" y="-12" width="6" height="5"/><path d="M-13 1 H13 C12 9 5 12 -2 12 C-8 12 -12 8 -13 1Z"/></g>
        <text y="58" fill="#e2e8f0">Dockerize</text>
      </g>
      <g transform="translate(820 30)">
        <circle r="26" fill="#c084fc" filter="url(#blur)" class="pulse d4"/>
        <circle r="22" fill="#0b1020" stroke="#c084fc" stroke-width="3"/>
        <path d="M0 -11 L0 7 M-7 0 L0 7 L7 0 M-10 11 H10" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180)"/>
        <text y="58" fill="#e2e8f0">Push &amp; Deploy</text>
      </g>
      <g transform="translate(1080 30)">
        <circle r="26" fill="#e879f9" filter="url(#blur)" class="pulse d5"/>
        <circle r="22" fill="#0b1020" stroke="#e879f9" stroke-width="3"/>
        <circle r="10" fill="none" stroke="#e879f9" stroke-width="2.5"/>
        <path d="M-10 0 H10 M0 -10 C-6 -4 -6 4 0 10 M0 -10 C6 -4 6 4 0 10" fill="none" stroke="#e879f9" stroke-width="2"/>
        <text y="58" fill="#e2e8f0">Live</text>
      </g>
    </g>
  </g>

  <!-- terminal card -->
  <g transform="translate(860 60)">
    <rect width="340" height="170" rx="14" fill="#020617" fill-opacity="0.75" stroke="#334155"/>
    <circle cx="22" cy="20" r="6" fill="#f87171"/>
    <circle cx="42" cy="20" r="6" fill="#fbbf24"/>
    <circle cx="62" cy="20" r="6" fill="#34d399"/>
    <text x="96" y="25" font-size="12" fill="#64748b">.github/workflows/deploy.yml</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="14">
      <text x="22" y="62" fill="#34d399">✔ <tspan fill="#cbd5e1">checkout</tspan></text>
      <text x="22" y="88" fill="#34d399">✔ <tspan fill="#cbd5e1">npm ci &amp;&amp; npm test</tspan></text>
      <text x="22" y="114" fill="#34d399">✔ <tspan fill="#cbd5e1">docker build &amp; push</tspan></text>
      <text x="22" y="140" fill="#22d3ee">➜ <tspan fill="#cbd5e1">deploy to server</tspan><tspan fill="#e879f9" class="pulse"> ▌</tspan></text>
    </g>
  </g>
</svg>
